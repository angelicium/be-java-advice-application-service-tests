---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.APP_NAME }}-nodeport"
  namespace: "{{ .Release.Namespace }}"
spec:
  type: NodePort
  selector:
    app: "{{ .Values.APP_NAME }}"
  ports:
    - port: 8080           # Внутренний порт сервиса
      targetPort: 8080     # Порт контейнера
      nodePort: 32102      # Внешний порт на ноде (в диапазоне 30000–32767)